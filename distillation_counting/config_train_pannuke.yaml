dataset:
  train:
    name: pannuke
    root: "/kaggle/working/coco"      # chứa fold12/ (đã gộp fold1+fold2, trừ colon)
    fold: fold12
    num_classes: 5
  val:
    name: pannuke
    root: "/kaggle/working/coco"      # fold3 SẠCH — monitor loss (theo đúng convention DualU-Net: val=Test)
    fold: fold3
    num_classes: 5

loader:
  train:
    shuffle: True
    batch_size: 8
    num_workers: 2
    drop_last: False
  val:
    shuffle: False
    batch_size: 1
    num_workers: 1
    drop_last: False

optimizer:
  lr_base: 0.0002
  epochs: 50
  weight_decay: 0.0001
  lr_drop_factor: 0.1
  lr_drop_steps:
    - 35
    - 45
  lr_auto_scale: True

distributed: False                    # Kaggle 1 GPU

training:
  weight_dice: 1.0
  weight_dice_b: 1.0
  weight_ce: 1.0
  weight_mse: 1.0
  ce_weights: ./ce_weights_pannuke_fold12.npy   # CHƯA tồn tại -> train.py tự tính & lưu
  sigma: 5
  th: 0.15

transforms:
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentations:
    - name: "hflip"
      p: 0.5
    - name: "vflip"
      p: 0.5
    - name: "rotate90"

model:
  encoder_name: resnext50_32x4d
  classes_s: 5                        # 5 lớp nhân PanNuke (segmentation)
  classes_c: 1                        # 1 kênh centroid/density (đếm)
  encoder_weights: imagenet
  decoder_channels: [256, 128, 64, 32, 16]
  decoder_use_batchnorm: True

evaluation:
  thresholds: [0.5]
  max_pair_distance: 12
  interval: 10

experiment:
  wandb: False                        # Kaggle không login wandb
  project: "DualU-Net_pannuke"
  name: "resnext_pannuke_fold12"
  wandb_group: "train"
  seed: 42
  output_dir: /kaggle/working/checkpoints/
  output_name: "resnext_pannuke_fold12"
  resume: False
