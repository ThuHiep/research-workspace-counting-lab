dataset:
  test:
    name: pannuke
    root: "/kaggle/working/coco"      # fold3 (symlink tới input) — test SẠCH
    fold: fold3
    num_classes: 5

loader:
  val:
    shuffle: False
    batch_size: 1
    num_workers: 1
    drop_last: False
  test:
    shuffle: False
    batch_size: 1
    num_workers: 1
    drop_last: False

model:
  encoder_name: resnext50_32x4d
  classes_s: 5
  classes_c: 1
  encoder_weights: imagenet
  decoder_channels: [256, 128, 64, 32, 16]
  decoder_use_batchnorm: True

training:
  weight_dice: 1.0
  weight_dice_b: 1.0
  weight_ce: 1.0
  weight_mse: 1.0
  ce_weights: ./ce_weights_pannuke_fold12.npy
  sigma: 5
  th: 0.15

transforms:
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentations: []

distributed: False

evaluation:
  thresholds: [0.5]
  max_pair_distance: 12
  interval: 1

experiment:
  wandb: False
  project: "DualU-Net_pannuke"
  name: "resnext_pannuke_fold12_eval"
  wandb_group: "test"
  seed: 42
  output_dir: /kaggle/working/checkpoints/
  output_name: "resnext_pannuke_fold12"
